services:
  - type: web
    name: meetsync
    runtime: node
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: ROUTES_DAILY_LIMIT
        value: "0"
      - key: GOOGLE_ROUTES_ENABLED
        value: "false"
